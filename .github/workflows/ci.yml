name: 33JACK V3 AMA Testnet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Check serverless syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Amadeus SDK import
        run: node -e "import('@amadeus-protocol/sdk').then(m => { if(!m.AmadeusSDK) throw Error('SDK unavailable') })"
      - name: Ensure Vercel API function budget and routing
        run: npm run test:vercel
      - name: Test Amadeus V3 native transfer security
        run: npm run test:ama
      - name: Test V2 agent and operator security
        run: npm run test:platform
      - name: Test secure activation and ephemeral agent tokens
        run: npm run test:activation
      - name: Test owner wallet checkout and agent isolation
        run: npm run test:owner
      - name: Smoke backend flow
        run: npm run test:smoke
      - name: Build frontend
        run: npm run build
