name: 33JACK V3 Testnet CI

on:
  push:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation", "feat/ama-v3-m2-wallet-identity", "feat/ama-v3-m3-payment-intents", "feat/ama-v3-m4-execution-receipts", "feat/ama-v3-m5-ai-agent", "feat/ama-v3-m6-invoice-reconciliation", "feat/ama-v3-m7-compliance-governance", "feat/ama-v3-m8-testnet-experience", "feat/ama-v3-m9-e2e-security-acceptance", "feat/ama-v3-m10-final-testnet-demo-grants"]
  pull_request:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation", "feat/ama-v3-m2-wallet-identity", "feat/ama-v3-m3-payment-intents", "feat/ama-v3-m4-execution-receipts", "feat/ama-v3-m5-ai-agent", "feat/ama-v3-m6-invoice-reconciliation", "feat/ama-v3-m7-compliance-governance", "feat/ama-v3-m8-testnet-experience", "feat/ama-v3-m9-e2e-security-acceptance"]

permissions:
  contents: read

# Exact PR head source, not a synthetic GitHub merge commit.
env:
  M10_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  testnet-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check API syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test official Amadeus Testnet adapter
        run: npm run test:amadeus
      - name: Confirm legacy finance routes fail closed
        run: npm run test:isolation
      - name: Enforce M1 repo/network invariants
        run: npm run test:m1
      - name: Test M2 wallet identity, BLS auth and RBAC
        run: npm run test:m2
      - name: M3 native AMA payment intent security tests
        run: npm run test:m3
      - name: M4 native Testnet signed-packet and finality security tests
        run: npm run test:m4
      - name: M5 agent, MCP/A2A, injection and financial boundary unit tests
        run: npm run test:m5
      - name: M6 PDF source security, native invoice and accounting tests
        run: npm run test:m6
      - name: M7 native AMA policy, maker-checker and audit security unit tests
        run: npm run test:m7
      - name: M8 native network UX, verified receipts and accessibility security tests
        run: npm run test:m8
      - name: M9 full native AMA acceptance and independent-evidence unit tests
        run: npm run test:m9
      - name: M9 privilege, secret, governance and source security review
        run: npm run test:m9:security
      - name: M10 privacy-safe grant snapshot, fail-closed release and accessible operator UI
        run: npm run test:m10
      - name: M10 official native Testnet and protected Preview preparation
        run: npm run m10:preflight
      - name: Check Vercel function budget and routes
        run: npm run test:vercel
      - name: Build frontend
        run: npm run build

  m3-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M3 PostgreSQL ledger and authenticated HTTP acceptance
        run: npm run test:m3:db

  m4-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M4 PostgreSQL one-attempt execution and authenticated HTTP acceptance
        run: npm run test:m4:db

  m5-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M5 financial tool, tenant, CSRF, prompt injection and database acceptance
        run: npm run test:m5:db

  m6-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run idempotent M6 schema migration
        run: npm run migrate:m6
      - name: M6 PostgreSQL invoice matching and security acceptance
        run: npm run test:m6:db
      - name: Backup and restore disposable PostgreSQL
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m6-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m6restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m6restore" m6-backup.dump
      - name: Verify restored provenance, receipts and immutable audit
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m6restore
        run: npm run test:m6:restore

  m7-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M7 repeated forward-only governance migration
        run: |
          npm run migrate:m7
          npm run migrate:m7
      - name: M7 real PostgreSQL maker-checker, pause, risk and audit acceptance
        run: npm run test:m7:db
      - name: Backup and restore into independent disposable PostgreSQL
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m7-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m7restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m7restore" m7-backup.dump
      - name: Verify restored policy, seals, hash-linked events and preserved M6
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m7restore
        run: npm run test:m7:restore

  m8-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M8 authenticated read-only dashboard and receipt integrity acceptance
        run: npm run test:m8:db
      - name: Backup and restore M2-M7 evidence into independent PostgreSQL
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m8-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m8restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m8restore" m8-backup.dump
      - name: Validate restored native AMA finality truth and historical integrity
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m8restore
        run: npm run test:m8:restore

  m9-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact M9 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean dependency installation
        run: npm install --ignore-scripts
      - name: Critical dependency vulnerability gate and redacted severity review
        run: |
          npm audit --omit=dev --json > m9-audit.json || true
          node scripts/m9-dependency-audit.mjs m9-audit.json
      - name: Repeat forward-only M9 Testnet schema migration
        run: |
          npm run migrate:m9
          npm run migrate:m9
      - name: M9 end-to-end synthetic wallet through receipt, adverse cases and HTTP boundaries
        run: npm run test:m9:db
      - name: Generate explicitly synthetic, redacted CI acceptance artifact
        run: npm run m9:ci-report
      - name: Backup and restore M2-M9 PostgreSQL into independent disposable database
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m9-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m9restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m9restore" m9-backup.dump
      - name: Verify restore, original provenance, single reservation and immutable hash chain
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m9restore
        run: npm run test:m9:restore
      - name: Retain synthetic CI evidence only (not live Testnet claims)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-synthetic-ci-acceptance
          path: m9-artifacts/m9-synthetic-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  m10-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact M10 source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install (lockfile absence remains a separate release blocker)
        run: npm install --ignore-scripts
      - name: M10 offline Testnet-only environment/security preflight
        run: npm run m10:preflight
      - name: M10 zero critical/high dependency advisory gate
        run: |
          npm audit --omit=dev --json > m10-audit.json || true
          node scripts/m9-dependency-audit.mjs m10-audit.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const v=JSON.parse(readFileSync("m10-audit.json")).metadata.vulnerabilities; if(!Number.isInteger(v.high)||v.high!==0||v.critical!==0)process.exit(1)'
      - name: M9 predecessor complete financial and security synthetic acceptance
        run: npm run test:m9:db
      - name: M10 owner-only redacted grant export, privacy and HTTP isolation acceptance
        run: npm run test:m10:db
      - name: Generate exact-SHA source-pinned redacted Testnet evidence artifact
        run: npm run m10:ci-artifact
      - name: Independent M10 PostgreSQL backup/restore of M2–M9 records
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m10-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m10restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m10restore" m10-backup.dump
      - name: Verify restored SHA, invoice provenance, M4 one attempt, M7/M9 append-only
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m10restore
        run: npm run test:m10:restore
      - name: Upload synthetic-only grant-readiness evidence, no live-transfer claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-synthetic-grant-evidence
          path: |
            m10-artifacts/m10-grant-evidence.json
            m10-artifacts/m10-sha256.txt
          if-no-files-found: ignore
          retention-days: 7
