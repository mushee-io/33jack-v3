name: 33JACK V3 Testnet CI

on:
  push:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation", "feat/ama-v3-m2-wallet-identity"]
  pull_request:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation"]

permissions:
  contents: read

jobs:
  testnet-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check API syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test official Amadeus Testnet adapter
        run: npm run test:amadeus
      - name: Confirm legacy finance routes fail closed
        run: npm run test:isolation
      - name: Enforce M1 repo/network invariants
        run: npm run test:m1
      - name: Test M2 wallet identity, BLS auth and RBAC
        run: npm run test:m2
      - name: Check Vercel function budget and routes
        run: npm run test:vercel
      - name: Build frontend
        run: npm run build
