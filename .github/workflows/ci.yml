name: 33JACK V3 Testnet CI

on:
  push:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation", "feat/ama-v3-m2-wallet-identity", "feat/ama-v3-m3-payment-intents", "feat/ama-v3-m4-execution-receipts", "feat/ama-v3-m5-ai-agent", "feat/ama-v3-m6-invoice-reconciliation", "feat/ama-v3-m7-compliance-governance"]
  pull_request:
    branches: ["main", "feat/amadeus-testnet-v3", "feat/ama-v3-m1-foundation", "feat/ama-v3-m2-wallet-identity", "feat/ama-v3-m3-payment-intents", "feat/ama-v3-m4-execution-receipts", "feat/ama-v3-m5-ai-agent", "feat/ama-v3-m6-invoice-reconciliation"]

permissions:
  contents: read

jobs:
  testnet-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check API syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test official Amadeus Testnet adapter
        run: npm run test:amadeus
      - name: Confirm legacy finance routes fail closed
        run: npm run test:isolation
      - name: Enforce M1 repo/network invariants
        run: npm run test:m1
      - name: Test M2 wallet identity, BLS auth and RBAC
        run: npm run test:m2
      - name: M3 native AMA payment intent security tests
        run: npm run test:m3
      - name: M4 native Testnet signed-packet and finality security tests
        run: npm run test:m4
      - name: M5 agent, MCP/A2A, injection and financial boundary unit tests
        run: npm run test:m5
      - name: M6 PDF source security, native invoice and accounting tests
        run: npm run test:m6
      - name: M7 native AMA policy, maker-checker and audit security unit tests
        run: npm run test:m7
      - name: Check Vercel function budget and routes
        run: npm run test:vercel
      - name: Build frontend
        run: npm run build

  m3-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M3 PostgreSQL ledger and authenticated HTTP acceptance
        run: npm run test:m3:db

  m4-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M4 PostgreSQL one-attempt execution and authenticated HTTP acceptance
        run: npm run test:m4:db

  m5-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M5 financial tool, tenant, CSRF, prompt injection and database acceptance
        run: npm run test:m5:db

  m6-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run idempotent M6 schema migration
        run: npm run migrate:m6
      - name: M6 PostgreSQL invoice matching and security acceptance
        run: npm run test:m6:db
      - name: Backup and restore disposable PostgreSQL
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m6-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m6restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m6restore" m6-backup.dump
      - name: Verify restored provenance, receipts and immutable audit
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m6restore
        run: npm run test:m6:restore

  m7-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AMA_TESTNET_RPC_URL: https://testnet-rpc.ama.one/api
      AMA_M4_ENABLE_BROADCAST: "false"
      AMA_M4_WALLET_EXTENSION_VERIFIED: "false"
      AMA_M4_TWO_WALLET_ACCEPTANCE_VERIFIED: "false"
      AMA_M5_ALLOW_REMOTE_AI: "false"
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: M7 repeated forward-only governance migration
        run: |
          npm run migrate:m7
          npm run migrate:m7
      - name: M7 real PostgreSQL maker-checker, pause, risk and audit acceptance
        run: npm run test:m7:db
      - name: Backup and restore into independent disposable PostgreSQL
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file=m7-backup.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE m7restore;"
          pg_restore --no-owner --no-privileges --exit-on-error --dbname="postgres://postgres:postgres@127.0.0.1:5432/m7restore" m7-backup.dump
      - name: Verify restored policy, seals, hash-linked events and preserved M6
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/m7restore
        run: npm run test:m7:restore
