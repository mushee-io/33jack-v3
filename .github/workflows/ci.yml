name: 33jack CI

on:
  push:
    branches: [main, 'feat/amadeus-testnet-v3']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Check serverless syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test native Amadeus Testnet integration
        run: npm run test:amadeus
      - name: Ensure Vercel API function budget and routing
        run: npm run test:vercel
      - name: Build frontend
        run: npm run build
